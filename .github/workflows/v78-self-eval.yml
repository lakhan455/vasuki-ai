name: Vasuki V78 Self-Evaluation 2.0

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/v78-self-eval.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/v78-self-eval.yml"
  workflow_dispatch:

jobs:
  regression-matrix:
    name: regression-${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: browser-project
            tests: "tests/test_v70_real_browser_agent.py tests/test_v71_project_brain_3.py"
          - suite: data-agents
            tests: "tests/test_v72_data_analyst.py tests/test_v73_multi_agent.py"
          - suite: memory-automation
            tests: "tests/test_v74_memory3.py tests/test_v75_autonomous_tasks.py"
          - suite: workspace-security
            tests: "tests/test_v76_live_workspace.py tests/test_v77_approval_engine.py"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run regression suite
        run: python -m pytest -q ${{ matrix.tests }}

  fixed-eval-gate:
    name: fixed-400-case-eval
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend
        run: python -m pip install -r requirements.txt pytest
      - name: Run deterministic V78 release eval
        run: >-
          python scripts/run_v78_eval.py
          --mode contract
          --release "${GITHUB_SHA}"
          --limit 400
          --min-score 60
          --min-category-score 50
          --output v78-eval-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: v78-eval-report
          path: backend/v78-eval-report.json

  frontend-release-gate:
    name: frontend-release-gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      NEXT_PUBLIC_IMAGE_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  release-gate:
    name: v78-release-gate
    if: always()
    needs: [regression-matrix, fixed-eval-gate, frontend-release-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce all V78 gates
        shell: bash
        run: |
          echo "regression-matrix=${{ needs.regression-matrix.result }}"
          echo "fixed-eval-gate=${{ needs.fixed-eval-gate.result }}"
          echo "frontend-release-gate=${{ needs.frontend-release-gate.result }}"
          test "${{ needs.regression-matrix.result }}" = "success"
          test "${{ needs.fixed-eval-gate.result }}" = "success"
          test "${{ needs.frontend-release-gate.result }}" = "success"
